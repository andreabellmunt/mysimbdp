version: "2"

# Cassandra part extracted from https://github.com/rdsea/bigdataplatforms/blob/master/tutorials/basiccassandra/apache-compose.yml 
x-cassandra: &cassandras
  CASSANDRA_CLUSTER_NAME: assignment1
  CASSANDRA_SEEDS: cassandra0
  HEAP_NEWSIZE: 1M
  MAX_HEAP_SIZE: 512M
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    
x-expose: &exposes
    - "7000" 
    - "7001" 
    - "7199" 
    - "9042" 
    - "9142" 
    - "9160" 


services:
  zookeeper:
    image: docker.io/bitnami/zookeeper:3.8
    ports:
      - "2181:2181"
    volumes:
      - "zookeeper_data:/bitnami"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
  kafka0:
    image: docker.io/bitnami/kafka:2.8
    ports:
      - "9092:9092"
    volumes:
      - "kafka0_data:/bitnami"
    environment:
      - KAFKA_BROKER_ID=0
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://kafka0:19092,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka0:19092,EXTERNAL://localhost:9092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    depends_on:
      - zookeeper

  kafka1:
    image: docker.io/bitnami/kafka:2.8
    ports:
      - "9093:9092"
    volumes:
      - "kafka1_data:/bitnami"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://kafka1:19092,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka1:19092,EXTERNAL://localhost:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    depends_on:
      - zookeeper

  kafka2:
    image: docker.io/bitnami/kafka:2.8
    ports:
      - "9094:9092"
    volumes:
      - "kafka2_data:/bitnami"
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://kafka2:19092,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka2:19092,EXTERNAL://localhost:9094
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    depends_on:
      - zookeeper

  cassandra0:
    image: cassandra:latest
    hostname: cassandra0
    environment: 
      <<: *cassandras
      CASSANDRA_DC: DC1   
    expose: *exposes
    ports: 
      - "9042:9042"

  cassandra1:
    image: cassandra:latest
    hostname: cassandra1
    environment: 
      <<: *cassandras
      CASSANDRA_DC: DC1   
    expose: *exposes      
    ports: 
      - "9043:9042"
    restart: always
    depends_on: 
      - cassandra0
    

  cassandra2:
    image: cassandra:latest
    hostname: cassandra2
    environment: 
      <<: *cassandras
      CASSANDRA_DC: DC2 
    expose: *exposes
    restart: always
  
    depends_on: 
      - cassandra0 
    ports: 
      - "9044:9042"


  producer: 
    build: ./producer
    depends_on:
      - kafka0
    volumes: 
      - ../data:/app/data
  
  api: 
    build: ./api
    ports:
      - "8080:8080"
    depends_on: 
      - cassandra0
      - cassandra1
      - cassandra2

  consumer: 
    build: ./consumer
    depends_on: 
      - kafka0
      - api

volumes:
  zookeeper_data:
    driver: local
  kafka0_data:
    driver: local
  kafka1_data:
    driver: local
  kafka2_data:
    driver: local