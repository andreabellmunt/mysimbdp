version: "2"

services:
  zookeeper:
    image: docker.io/bitnami/zookeeper:3.8
    ports:
      - "2181:2181"
    volumes:
      - "zookeeper_data:/bitnami"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
  kafka0:
    image: docker.io/bitnami/kafka:2.8
    ports:
      - "9092:9092"
    volumes:
      - "kafka0_data:/bitnami"
    environment:
      - KAFKA_BROKER_ID=0
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://kafka0:19092,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka0:19092,EXTERNAL://localhost:9092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    depends_on:
      - zookeeper

  kafka1:
    image: docker.io/bitnami/kafka:2.8
    ports:
      - "9093:9092"
    volumes:
      - "kafka1_data:/bitnami"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://kafka1:19092,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka1:19092,EXTERNAL://localhost:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    depends_on:
      - zookeeper

  kafka2:
    image: docker.io/bitnami/kafka:2.8
    ports:
      - "9094:9092"
    volumes:
      - "kafka2_data:/bitnami"
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://kafka2:19092,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka2:19092,EXTERNAL://localhost:9094
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    depends_on:
      - zookeeper

  cassandra0:
    image: cassandra:latest
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: assignment1
      CASSANDRA_SEEDS: cassandra0
      CASSANDRA_ENDPOINT_SWITCH: SimpleSnitch #SimpleStrategy 
    volumes: 
      - cassandra0_data:/var/lib/cassandra

  cassandra1:
    image: cassandra:latest
    ports:
      - "9043:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: assignment1
      CASSANDRA_SEEDS: cassandra0
      CASSANDRA_ENDPOINT_SWITCH: SimpleSnitch #SimpleStrategy 
    volumes: 
      - cassandra1_data:/var/lib/cassandra

  cassandra2:
    image: cassandra:latest
    ports:
      - "9044:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: assignment1
      CASSANDRA_SEEDS: cassandra0
      CASSANDRA_ENDPOINT_SWITCH: SimpleSnitch #SimpleStrategy 
    volumes: 
      - cassandra2_data:/var/lib/cassandra


  producer: 
    build: ./producer
    depends_on:
      - kafka0
    volumes: 
      - ../data:/app/data
  
  api: 
    build: ./api
    depends_on: 
      - cassandra0
      - cassandra1
      - cassandra2
    volumes: 
      - ../data:/app/data

  consumer: 
    build: ./consumer
    depends_on: 
      - kafka0
      - api
    volumes: 
      - ../data:/app/data

volumes:
  zookeeper_data:
    driver: local
  kafka0_data:
    driver: local
  kafka1_data:
    driver: local
  kafka2_data:
    driver: local
  cassandra0_data:
    driver: local
  cassandra1_data:
    driver: local
  cassandra2_data:
    driver: local